<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - TechFuture Expo</title>
</head>
<body>

<h1>Inscrição para a TechFuture Expo 2026</h1>

<form>

<fieldset>
<legend>Dados Pessoais</legend>

<label>Nome:</label> <input type="text" name="nome"><br><br>

<label>Sobrenome:</label> <input type="text" name="sobrenome"><br><br>

<label>CPF:</label> <input type="number" name="cpf"><br><br>

<label>RG:</label> <input type="number" name="rg"><br><br>

<label>Data de nascimento:</label> <input type="date" name="nascimento"><br><br>

<label>E-mail:</label> <input type="email" name="email"><br><br>

<label>Telefone:</label> <input type="tel" name="telefone"><br><br>

</fieldset>

<fieldset>
<legend>Dados Profissionais</legend>

<label>Empresa:</label> <input type="text" name="empresa"><br><br>

<label>Cargo:</label> <input type="text" name="cargo"><br><br>

<label>Área de atuação:</label> <input type="text" name="area"><br><br>

<label>Site (URL):</label> <input type="url" name="site"><br><br>

</fieldset>

<fieldset>
<legend>Participação</legend>

<label>Dias do evento:</label> <input type="checkbox"> Dia 1 <input type="checkbox"> Dia 2 <input type="checkbox"> Dia 3 <br><br>

<label>Trilha de interesse:</label> <select> <option>IA</option> <option>Desenvolvimento Web</option> <option>Robótica</option> </select>

<br><br>

<label>Alimentação especial:</label> <input type="radio" name="alimentacao"> Sim <input type="radio" name="alimentacao"> Não

<br><br>

<label>Nível de interesse:</label> <input type="range" min="0" max="10">

<br><br>

<label>Cor favorita do crachá:</label> <input type="color">

<br><br>

<label>Upload de documento:</label> <input type="file">

</fieldset>

<fieldset>
<legend>Acesso</legend>

<label>Senha:</label> <input type="password">

</fieldset>

<br>

<button type="submit">Enviar inscrição</button>

</form>

</body>
</html>
