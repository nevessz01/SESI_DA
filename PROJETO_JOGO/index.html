<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo de Adivinhação</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎯 Jogo de Adivinhação</h1>

        <p>
            Tente adivinhar o número secreto entre
            <strong>1 e 100</strong>.
        </p>

        <div class="jogo">

            <label for="palpite">Digite seu palpite:</label>

            <input
                type="number"
                id="palpite"
                min="1"
                max="100"
            >

            <button onclick="verificarPalpite()">
                Adivinhar
            </button>

            <p id="mensagem"></p>

            <p>
                Tentativas:
                <span id="tentativas">0</span>
            </p>

        </div>

        <div class="resultado">

            <h2>🏆 Resultado</h2>

            <p>
                Melhor resultado:
                <span id="melhorResultado">Nenhuma tentativa ainda</span>
            </p>

            <button onclick="novoJogo()">
                Novo Jogo
            </button>

            <button onclick="limparHistorico()">
                Limpar Histórico
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
