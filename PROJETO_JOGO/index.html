
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎯 Jogo de Adivinhação</h1>

        <p class="descricao">
            Tente descobrir o número secreto entre 1 e 100!
        </p>

        <div class="jogo">

            <input
                type="number"
                id="palpite"
                placeholder="Digite seu palpite"
                min="1"
                max="100"
            >

            <button id="btnPalpite">Tentar</button>

            <p id="mensagem">Faça seu primeiro palpite!</p>

            <p>Tentativas: <span id="tentativas">0</span></p>

            <button id="btnNovoJogo">Novo jogo</button>

        </div>

        <div class="historico">
            <h2>Histórico</h2>

            <ul id="listaHistorico"></ul>
        </div>

        <div class="recorde">
            <p>
                Melhor resultado:
                <strong id="melhorResultado">--</strong>
            </p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
